site:
  name: Recomby.ai
  site: 'https://recomby.ai'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: Mevxr7i9ZnMmj1PNaceavOkuOV2vG58xMhNdCuoqb64

# Default SEO metadata
metadata:
  title:
    default: Recomby.ai
    template: '%s — Recomby.ai'
  description: 'Your AI employee for Generative Engine Optimization (GEO). 9 specialized skills that get your brand cited by ChatGPT, Perplexity, Gemini, and Google AI. Starting at $99/month.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Recomby.ai # 修改 OG 名称
    images:
      - url: '~/assets/images/default.png' # 建议后续替换成你自己的 OpenGraph 封面图
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@recomby_ai' # 根据你的Reddit ID猜测的，如果没有Twitter可以留空或填正确的
    site: '@recomby_ai'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # 如果有 GA ID，填在这里，例如 "G-XXXXXXXXXX"

ui:
  theme: 'system'

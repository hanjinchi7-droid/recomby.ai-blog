[build]
  publish = "dist"
  command = "npm run build"
[build.processing.html]
  pretty_urls = false

# Admin subdomain redirect
[[redirects]]
  from = "https://admin.recomby.ai/*"
  to = "https://blog.recomby.ai/admin/:splat"
  status = 200
  force = false

# Cache headers
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 后端配置：使用 Git Gateway 配合 Netlify Identity
backend:
  name: git-gateway
  branch: main

# --- 关键修改：站点链接 ---
# 这里必须填你的前端博客地址，否则后台无法预览
site_url: https://blog.recomby.ai
display_url: https://blog.recomby.ai

# --- 关键修改：图片路径 ---
# 对应你移动到 public 文件夹后的位置
media_folder: "public/assets/images" # 图片上传后的物理存储位置
public_folder: "/assets/images"      # 写入 Markdown 文件的路径字符串

# 内容集合配置
collections:
  - name: "post"
    label: "博客文章"
    folder: "src/data/post/insights"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    identifier_field: "title"

    fields:
      - label: "标题"
        name: "title"
        widget: "string"
        required: true

      - label: "发布日期"
        name: "publishDate"
        widget: "datetime"
        required: true
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm:ss"
        format: "YYYY-MM-DDTHH:mm:ssZ"

      - label: "URL Slug"
        name: "slug"
        widget: "string"
        required: true
        # 建议加上这个正则限制，防止输入空格或特殊字符导致 URL 报错
        pattern: ["^[a-z0-9-]+$", "Slug 只能包含小写字母、数字和连字符 (例如: my-first-post)"]
        hint: "用于URL的唯一标识符"

      - label: "作者"
        name: "author"
        widget: "string"
        default: "zhengyucheng"
        required: true

      - label: "摘要"
        name: "excerpt"
        widget: "text"
        required: true
        hint: "文章简介，显示在列表页"

      - label: "封面图"
        name: "image"
        widget: "image"
        required: false
        allow_multiple: false
        hint: "文章封面图片"

      - label: "标签"
        name: "tags"
        widget: "list"
        required: false
        allow_add: true
        hint: "文章标签，按回车添加"

      - label: "Canonical URL"
        name: "metadata.canonical"
        widget: "string"
        required: false
        hint: "文章的规范URL地址"

      - label: "正文"
        name: "body"
        widget: "markdown"
        required: true